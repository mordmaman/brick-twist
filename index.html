        g.fx.sound('shove');
        g.fx.text(b.x + b.w / 2, b.y - 6, 'Up!', '#7dfff0');
        g.fx.burst(b.x + b.w / 2, b.y + b.h, '#7dfff0', 8, 'spark');
      }
      g.sinceHit = 0;
      return true;
    },
    onLifeLost: function (g, r) {
      r.s.offset = Math.max(0, r.s.offset - r.p.resetOnLife);
      r.s.shoveLeft = 0;
    },
    render: function (ctx, g, r, layer) {
      if (layer !== 'back') return;
      var y = this.dangerY(g, r), a = 0.25 + 0.6 * r.s.danger;
      if (r.s.danger > 0.6) a *= 0.75 + 0.25 * Math.sin(g.t * 12);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,80,90,' + a.toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -g.t * 20;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(C.W, y); ctx.stroke();
      ctx.restore();
    }
  });

  // ---------------- Orbit: rings rotate round a core; only the core matters ----------------
  // params: cx, cy, rings [{ radius, speed (rad/s), pattern (one char per slot), size }]
  register('orbit', {
    init: function (g, r) {
      var p = r.p;
      r.s.t = 0;
      var core = BT.Bricks.make('core', p.cx - 14, p.cy - 14, 28, 28);
      core.hp = core.maxHp = Math.max(2, Math.round(p.coreHp * (g.preset.bossHpScale > 1 ? 1.25 : 1)));
      core.color = '#ffe27a'; core.owner = r; core.required = true;
      g.addBrick(core);
      r.s.core = core;
      for (var ri = 0; ri < p.rings.length; ri++) {
        var ring = p.rings[ri], pat = ring.pattern, sz = ring.size || 16;
        for (var i = 0; i < pat.length; i++) {
          var b = BT.Bricks.fromChar(pat[i], 0, 0, sz, sz);
          if (!b) continue;
          b.owner = r; b.required = false; b.orbit = ring; b.a0 = i / pat.length * TAU;
          g.addBrick(b);
        }
      }
      this.place(g, r);
    },
    place: function (g, r) {
      var p = r.p, t = r.s.t;
      for (var i = 0; i < g.bricks.length; i++) {
        var b = g.bricks[i];
        if (b.owner !== r || !b.orbit) continue;
        var a = b.a0 + b.orbit.speed * t;
        b.bx = p.cx + Math.cos(a) * b.orbit.radius - b.w / 2;
        b.by = p.cy + Math.sin(a) * b.orbit.radius - b.h / 2;
      }
    },
    update: function (g, r, dt) {
      r.s.t += dt * g.preset.hazardScale;
      this.place(g, r);
    },
    onBrickDestroyed: function (g, r, b) {
      if (b !== r.s.core) return;
      g.fx.ring(r.p.cx, r.p.cy, 140, '#ffe27a');
      g.fx.shake(C.shake.boss);
      for (var i = 0; i < g.bricks.length; i++) {
        var k = g.bricks[i];
        if (k.alive && k.owner === r) g.destroyBrick(k, 'core');
      }
    },
    render: function (ctx, g, r, layer) {
      if (layer !== 'back') return;
      var p = r.p;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,226,122,0.10)';
      ctx.lineWidth = 1;
      for (var i = 0; i < p.rings.length; i++) {
        ctx.beginPath(); ctx.arc(p.cx, p.cy, p.rings[i].radius, 0, TAU); ctx.stroke();
      }
      if (r.s.core.alive) {
        var pulse = 0.5 + 0.5 * Math.sin(g.t * 4);
        var grd = ctx.createRadialGradient(p.cx, p.cy, 4, p.cx, p.cy, 40);
        grd.addColorStop(0, 'rgba(255,226,122,' + (0.35 + 0.2 * pulse).toFixed(3) + ')');
        grd.addColorStop(1, 'rgba(255,226,122,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(p.cx, p.cy, 40, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  });

  // ---------------- Pendulum: brick clusters swing on chains ----------------
  // params: pendulums [{ x, y (pivot), len, amp (deg), period, phase, cluster [strings] }]
  register('pendulum', {
    init: function (g, r) {
      var gr = C.grid;
      r.s.t = 0;
      r.s.list = [];
      for (var pi = 0; pi < r.p.pendulums.length; pi++) {
        var pd = r.p.pendulums[pi], cl = pd.cluster;
        var cols = cl[0].length, wpx = cols * gr.cellW;
        var item = { pd: pd, bricks: [], bobX: pd.x, bobY: pd.y + pd.len };
        for (var row = 0; row < cl.length; row++) {
          for (var col = 0; col < cl[row].length; col++) {
            var b = BT.Bricks.fromChar(cl[row][col], 0, 0, gr.brickW, gr.brickH);
            if (!b) continue;
            b.owner = r;
            b.relX = -wpx / 2 + col * gr.cellW + 1;
            b.relY = row * gr.cellH + 1;
            g.addBrick(b);
            item.bricks.push(b);
          }
        }
        r.s.list.push(item);
      }
      this.place(g, r);
    },
    place: function (g, r) {
      for (var i = 0; i < r.s.list.length; i++) {
        var it = r.s.list[i], pd = it.pd;
        var a = pd.amp * P.DEG * Math.sin(TAU * r.s.t / pd.period + (pd.phase || 0));
        it.bobX = pd.x + Math.sin(a) * pd.len;
        it.bobY = pd.y + Math.cos(a) * pd.len;
        for (var k = 0; k < it.bricks.length; k++) {
          var b = it.bricks[k];
          b.bx = it.bobX + b.relX; b.by = it.bobY + b.relY;
        }
      }
    },
    update: function (g, r, dt) {
      r.s.t += dt * Math.sqrt(g.preset.hazardScale);
      this.place(g, r);
    },
    render: function (ctx, g, r, layer) {
      if (layer !== 'back') return;
      ctx.save();
      for (var i = 0; i < r.s.list.length; i++) {
        var it = r.s.list[i], pd = it.pd, any = false;
        for (var k = 0; k < it.bricks.length; k++) if (it.bricks[k].alive) { any = true; break; }
        ctx.fillStyle = '#8a93a8';
        ctx.beginPath(); ctx.arc(pd.x, pd.y, 4, 0, TAU); ctx.fill();
        if (!any) continue;
        // chain: dotted links
        ctx.strokeStyle = 'rgba(190,200,220,0.7)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(pd.x, pd.y); ctx.lineTo(it.bobX, it.bobY); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }
  });

  // ---------------- Portals: paired; in one, out of its twin ----------------
  // params: pairs [[{x,y},{x,y}], ...]
  var PORTAL_COLORS = ['#ff9f43', '#4fd8ff', '#c56bff'];
  register('portals', {
    init: function (g, r) { r.s.t = 0; r.s.flash = [0, 0, 0, 0, 0, 0]; },
    update: function (g, r, dt) {
      r.s.t += dt;
      for (var i = 0; i < r.s.flash.length; i++) if (r.s.flash[i] > 0) r.s.flash[i] -= dt;
    },
    onBallStep: function (g, r, ball) {
      var pairs = r.p.pairs, rad = r.p.radius, cap = rad * r.p.captureFrac;
      for (var pi = 0; pi < pairs.length; pi++) {
        for (var e = 0; e < 2; e++) {
          var id = pi * 2 + e, A = pairs[pi][e], B = pairs[pi][1 - e];
          if (ball.portalLock === id) {
            var dx = ball.x - A.x, dy = ball.y - A.y;
            if (dx * dx + dy * dy > (rad + ball.r) * (rad + ball.r)) ball.portalLock = -1;
            continue;
          }
          if (distToSegment(A.x, A.y, ball.prevX, ball.prevY, ball.x, ball.y) < cap) {
            ball.x = B.x; ball.y = B.y; ball.prevX = B.x; ball.prevY = B.y;
            ball.portalLock = pi * 2 + (1 - e);
            ball.trailN = 0;
            r.s.flash[id] = 0.25; r.s.flash[pi * 2 + 1 - e] = 0.25;
            g.fx.sound('portal');
            g.fx.burst(A.x, A.y, PORTAL_COLORS[pi % 3], 8, 'spark');
            g.fx.burst(B.x, B.y, PORTAL_COLORS[pi % 3], 8, 'spark');
            return;
          }
        }
      }
    },
    render: function (ctx, g, r, layer) {
      if (layer !== 'back') return;
      var pairs = r.p.pairs, rad = r.p.radius, t = r.s.t;
      ctx.save();
      for (var pi = 0; pi < pairs.length; pi++) {
        var col = PORTAL_COLORS[pi % 3];
        for (var e = 0; e < 2; e++) {
          var A = pairs[pi][e], fl = r.s.flash[pi * 2 + e] > 0 ? 1 : 0;
          ctx.fillStyle = 'rgba(5,6,18,0.9)';
          ctx.beginPath(); ctx.arc(A.x, A.y, rad, 0, TAU); ctx.fill();
          ctx.strokeStyle = col; ctx.lineWidth = 3 + fl * 2;
          ctx.beginPath(); ctx.arc(A.x, A.y, rad, 0, TAU); ctx.stroke();
          ctx.lineWidth = 2;
          for (var k = 0; k < 3; k++) {
            var a0 = t * (e ? -3 : 3) + k * TAU / 3;
            ctx.beginPath(); ctx.arc(A.x, A.y, rad * 0.6, a0, a0 + 1.2); ctx.stroke();
          }
          // pair marker: same number of dots on both twins so they read without colour too
          ctx.fillStyle = col;
          for (var d = 0; d <= pi; d++) {
            ctx.beginPath(); ctx.arc(A.x - pi * 4 + d * 8, A.y + rad + 6, 2.2, 0, TAU); ctx.fill();
          }
        }
      }
      ctx.restore();
    }
  });

  // ---------------- Gravity wells: planets bend the ball ----------------
  // params: planets [{ x, y, mass }]
  register('wells', {
    init: function (g, r) { r.s.t = 0; },
    update: function (g, r, dt) { r.s.t += dt; },
    accel: function (g, r, x, y, out) {
      var pl = r.p.planets, k = r.p.accelAt60 * 3600 * g.preset.forceScale, md2 = r.p.minDist * r.p.minDist;
      out.ax = 0; out.ay = 0;
      for (var i = 0; i < pl.length; i++) {
        var dx = pl[i].x - x, dy = pl[i].y - y;
        var d2 = dx * dx + dy * dy, d = Math.sqrt(d2);
        if (d < 1e-3) continue;
        var a = k * (pl[i].mass || 1) / Math.max(d2, md2);
        out.ax += a * dx / d; out.ay += a * dy / d;
      }
    },
    onBallStep: function (g, r, ball, dt) {
      if (g.state !== 'play' && g.state !== 'clearing') return;
      this.accel(g, r, ball.x, ball.y, ACC);
      ball.vx += ACC.ax * dt; ball.vy += ACC.ay * dt;
      var pl = r.p.planets, pr = r.p.planetRadius;
      for (var i = 0; i < pl.length; i++) {
        if (P.circleCircle(ball.x, ball.y, ball.r, pl[i].x, pl[i].y, pr) > 0) {
          ball.x += HIT.nx * HIT.depth; ball.y += HIT.ny * HIT.depth;
          if (P.reflect(ball, HIT.nx, HIT.ny)) g.fx.sound('bumper', 0);
        }
      }
    },
    render: function (ctx, g, r, layer, R) {
      var pl = r.p.planets, pr = r.p.planetRadius, i;
      if (layer === 'back') {
        ctx.save();
        for (i = 0; i < pl.length; i++) {
          var x = pl[i].x, y = pl[i].y;
          for (var k = 0; k < 3; k++) { // gravity ripples flowing inward
            var ph = ((g.t * 0.6 + k / 3) % 1);
            var rr = pr + 70 * (1 - ph);
            ctx.strokeStyle = 'rgba(140,170,255,' + (0.18 * ph).toFixed(3) + ')';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.stroke();
          }
          var grd = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, pr);
          grd.addColorStop(0, '#d9c7ff'); grd.addColorStop(1, '#6b4fd8');
          ctx.fillStyle = grd;
          ctx.beginPath(); ctx.arc(x, y, pr, 0, TAU); ctx.fill();
          ctx.strokeStyle = 'rgba(220,200,255,0.8)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(x, y, pr * 1.7, pr * 0.5, -0.4, 0, TAU); ctx.stroke();
        }
        ctx.restore();
        return;
      }
      // front: predicted path for the first second after launch
      var p = r.p;
      for (i = 0; i < g.balls.length; i++) {
        var b = g.balls[i];
        if (b.stuck || g.sinceLaunch > p.predictSeconds || g.state !== 'play') continue;
        var alpha = 1 - g.sinceLaunch / p.predictSeconds;
        this.drawPrediction(ctx, g, r, b, alpha * 0.7);
      }
    },
    drawPrediction: function (ctx, g, r, b, alpha) {
      var x = b.x, y = b.y, vx = b.vx, vy = b.vy, sp = Math.sqrt(vx * vx + vy * vy);
      var dt = 1 / 60, pl = r.p.planets, pr = r.p.planetRadius;
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      for (var st = 0; st < 75; st++) {
        this.accel(g, r, x, y, ACC);
        vx += ACC.ax * dt; vy += ACC.ay * dt;
        var s = Math.sqrt(vx * vx + vy * vy); vx = vx / s * sp; vy = vy / s * sp;
        x += vx * dt; y += vy * dt;
        if (x < b.r) { x = b.r; vx = -vx; }
        if (x > C.W - b.r) { x = C.W - b.r; vx = -vx; }
        if (y < C.TOP + b.r) { y = C.TOP + b.r; vy = -vy; }
        var stop = false;
        for (var i = 0; i < pl.length; i++) {
          var dx = x - pl[i].x, dy = y - pl[i].y;
          if (dx * dx + dy * dy < (pr + b.r) * (pr + b.r)) stop = true;
        }
        for (var j = 0; j < g.bricks.length && !stop; j++) {
          var k = g.bricks[j];
          if (k.alive && x > k.x && x < k.x + k.w && y > k.y && y < k.y + k.h) stop = true;
        }
        if (stop || y > C.H) break;
        if (st % 3 === 0) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill(); }
      }
      ctx.restore();
    }
  });
  var ACC = { ax: 0, ay: 0 };

  // ---------------- Gusts: telegraphed sideways wind ----------------
  register('gusts', {
    init: function (g, r) {
      r.s.phase = 'calm'; r.s.timer = r.p.firstDelay; r.s.dir = 1; r.s.t = 0; r.s.k = 0;
    },
    update: function (g, r, dt) {
      var s = r.s, p = r.p;
      s.t += dt;
      if (g.state !== 'play') { if (s.phase !== 'calm') { s.phase = 'calm'; s.timer = p.firstDelay; } }
      else {
        s.timer -= dt;
        if (s.timer <= 0) {
          if (s.phase === 'calm') {
            s.phase = 'warn'; s.timer = p.warn;
            s.k++;
            s.dir = (s.k % 2 === 1) ? 1 : -1;
            if (g.rng() < 0.3) s.dir = -s.dir;
            g.fx.sound('windwarn');
          } else if (s.phase === 'warn') {
            s.phase = 'gust'; s.timer = p.gust; g.fx.sound('wind');
          } else {
            s.phase = 'calm'; s.timer = p.calmMin + g.rng() * (p.calmMax - p.calmMin);
          }
        }
      }
      var cv = s.phase === 'gust' ? s.dir * 45 : 0;
      for (var i = 0; i < g.capsules.length; i++) g.capsules[i].vx = cv;
    },
    onBallStep: function (g, r, ball, dt) {
      if (r.s.phase !== 'gust') return;
      ball.vx += r.s.dir * r.p.accel * g.preset.forceScale * dt;
    },
    render: function (ctx, g, r, layer) {
      if (layer !== 'front') return;
      var s = r.s;
      if (s.phase === 'calm') return;
      var warn = s.phase === 'warn';
      var a = warn ? 0.10 + 0.12 * (0.5 + 0.5 * Math.sin(s.t * 18)) : 0.38;
      var speed = warn ? 160 : 520, n = warn ? 14 : 28;
      ctx.save();
      ctx.strokeStyle = 'rgba(200,235,255,' + a.toFixed(3) + ')';
      ctx.lineWidth = warn ? 1.5 : 2;
      ctx.lineCap = 'round';
      var span = C.W + 120, h = C.H - C.TOP - 80;
      for (var i = 0; i < n; i++) {
        var y = C.TOP + 10 + ((i * 97.13) % h);
        var len = 20 + (i * 37) % 36;
        var x = ((i * 53.7 + s.t * speed) % span);
        x = s.dir > 0 ? x - 60 : C.W + 60 - x;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s.dir * len, y); ctx.stroke();
      }
      // big arrows on the side the wind blows towards
      ctx.fillStyle = 'rgba(200,235,255,' + (warn ? 0.5 + 0.4 * Math.sin(s.t * 18) : 0.7).toFixed(3) + ')';
      var ax = s.dir > 0 ? C.W - 22 : 22;
      for (var k = 0; k < 3; k++) {
        var ay = 200 + k * 120;
        ctx.beginPath();
        ctx.moveTo(ax + s.dir * 12, ay); ctx.lineTo(ax - s.dir * 6, ay - 12); ctx.lineTo(ax - s.dir * 6, ay + 12);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  });

  // ---------------- Pinball: bumpers and one-way gates ----------------
  // params: bumpers [{x,y}], gates [{x1,x2,y}] (gates let the ball through upward only)
  register('pinball', {
    init: function (g, r) {
      r.s.bf = new Float32Array(r.p.bumpers.length);
      r.s.gf = new Float32Array((r.p.gates || []).length);
    },
    update: function (g, r, dt) {
      var i;
      for (i = 0; i < r.s.bf.length; i++) if (r.s.bf[i] > 0) r.s.bf[i] -= dt;
      for (i = 0; i < r.s.gf.length; i++) if (r.s.gf[i] > 0) r.s.gf[i] -= dt;
    },
    onBallStep: function (g, r, ball) {
      var bm = r.p.bumpers, R = r.p.bumperRadius, i;
      for (i = 0; i < bm.length; i++) {
        if (P.circleCircle(ball.x, ball.y, ball.r, bm[i].x, bm[i].y, R) > 0) {
          ball.x += HIT.nx * HIT.depth; ball.y += HIT.ny * HIT.depth;
          P.reflect(ball, HIT.nx, HIT.ny);
          ball.boost = r.p.boost;
          r.s.bf[i] = 0.18;
          g.score += C.score.bumper;
          g.fx.sound('bumper', 1);
          g.fx.burst(bm[i].x + HIT.nx * R, bm[i].y + HIT.ny * R, '#ff6bcb', 6, 'spark');
        }
      }
      var gt = r.p.gates || [];
      for (i = 0; i < gt.length; i++) {
        var q = gt[i];
        if (ball.vy > 0 && ball.prevY + ball.r <= q.y + 0.5 && ball.y + ball.r >= q.y && ball.x >= q.x1 && ball.x <= q.x2) {
          ball.y = q.y - ball.r; ball.vy = -Math.abs(ball.vy);
          r.s.gf[i] = 0.2;
          g.fx.sound('gate');
        }
      }
    },
    render: function (ctx, g, r, layer) {
      if (layer !== 'back') return;
      var bm = r.p.bumpers, R = r.p.bumperRadius, i;
      ctx.save();
      for (i = 0; i < bm.length; i++) {
        var f = r.s.bf[i] > 0 ? 1 : 0, rr = R + f * 3;
        ctx.fillStyle = f ? '#ffd1f0' : '#ff6bcb';
        ctx.beginPath(); ctx.arc(bm[i].x, bm[i].y, rr, 0, TAU); ctx.fill();
        ctx.fillStyle = '#3a1240';
        ctx.beginPath(); ctx.arc(bm[i].x, bm[i].y, rr * 0.55, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#ffe0f6'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(bm[i].x, bm[i].y, rr, 0, TAU); ctx.stroke();
      }
      var gt = r.p.gates || [];
      for (i = 0; i < gt.length; i++) {
        var q = gt[i], fl = r.s.gf[i] > 0;
        ctx.strokeStyle = fl ? '#ffffff' : '#45f0a0';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(q.x1, q.y); ctx.lineTo(q.x2, q.y); ctx.stroke();
        // upward arrows: "this way only"
        ctx.fillStyle = 'rgba(69,240,160,0.75)';
        for (var x = q.x1 + 15; x < q.x2 - 5; x += 30) {
          var bob = Math.sin(g.t * 5 + x) * 1.5;
          ctx.beginPath();
          ctx.moveTo(x, q.y - 14 + bob); ctx.lineTo(x - 6, q.y - 5 + bob); ctx.lineTo(x + 6, q.y - 5 + bob);
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.restore();
    }
  });

  // ======================================================================================
  // World 4 - Lights and switches
  // ======================================================================================

  // ---------------- Lights Out: dark, lit around ball and paddle; glow bricks leave lanterns ----------------
  // Darkness is drawn in the renderOverBricks hook: over the bricks but under capsules, paddle and balls,
  // so those are always fully visible. Every standing brick keeps a faint outline so you can tell where they are.
  var MAX_LIGHTS = 48;
  register('lightsout', {
    init: function (g, r) {
      var s = r.s;
      s.pool = [];
      for (var i = 0; i < 20; i++) s.pool.push({ on: false, x: 0, y: 0, rad: 0, t: 0, max: 0 });
      s.list = new Float32Array(MAX_LIGHTS * 4); // x, y, radius, strength
      s.n = 0;
    },
    addLight: function (r, x, y, rad, time) {
      var pool = r.s.pool, pick = pool[0];
      for (var i = 0; i < pool.length; i++) {
        if (!pool[i].on) { pick = pool[i]; break; }
        if (pool[i].t < pick.t) pick = pool[i];
      }
      pick.on = true; pick.x = x; pick.y = y; pick.rad = rad; pick.t = time; pick.max = time;
    },
    update: function (g, r, dt) {
      var pool = r.s.pool;
      for (var i = 0; i < pool.length; i++) {
        var L = pool[i];
        if (L.on) { L.t -= dt; if (L.t <= 0) L.on = false; }
      }
    },
    onBrickDestroyed: function (g, r, b) {
      var p = r.p, cx = b.x + b.w / 2, cy = b.y + b.h / 2;

  // ---------------- On the Beat: bricks fade in and out on a steady pulse ----------------
  // params: pattern ('checker' | 'rows' | 'cols'). Two groups take turns being solid.

    period: function (g, r) { return r.p.period / Math.sqrt(g.preset.hazardScale); },

  // ---------------- Overgrown: vines regrow from their roots; kill the roots ----------------

  var NB4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    init: function (g, r) {

      var cells = {};

        }
      }

      }

    cellFree: function (g, row, col) {

      for (var i = 0; i < g.bricks.length; i++) {
        var b = g.bricks[i];

    grow: function (g, r, root) {

    render: function (ctx, g, r, layer) {

  });

  // ======================================================================================
  // World 5 - Flip the rules
  // ======================================================================================

  // ---------------- Double Trouble: a second paddle at the top copies yours ----------------
  // There is no top wall: a ball that gets past the top paddle is lost. The top paddle is wider than yours
  // and leans a little towards a ball coming up at it, so the game feels bigger rather than twice as hard.
  register('double', {
    init: function (g, r) {
      var s = r.s, p = r.p;
      g.topOpen = true;
      s.xp = g.addXPaddle({ y: C.TOP + p.gap, w: g.paddle.w * p.widthMult, x: g.paddle.x, face: 1, counts: true, owner: r, kind: 'mirror', color: '#ffb347' });
      s.assist = 0; s.topNet = !!g.preset.net; s.netFlash = 0;
    },
    update: function (g, r, dt) {
      var s = r.s, p = r.p, q = s.xp, pd = g.paddle;

        var b = g.balls[i];

        var t = (b.y - hitY) / -b.vy;
        if (t >= bestT) continue;
        bestT = t;

      q.x = nx;

      if (q.hitFlash > 0) q.hitFlash -= dt;
    },
    onBallStep: function (g, r, ball) {
      var s = r.s;

    },
    onLifeLost: function (g, r) { r.s.topNet = !!g.preset.net; },
    render: function (ctx, g, r, layer) {
      if (layer !== 'back') return;
      var s = r.s;
      ctx.save();

      var grd = ctx.createLinearGradient(0, C.TOP, 0, C.TOP + 18);
      grd.addColorStop(0, 'rgba(255,90,100,0.28)'); grd.addColorStop(1, 'rgba(255,90,100,0)');
      ctx.fillStyle = grd; ctx.fillRect(0, C.TOP, C.W, 18);
      ctx.strokeStyle = 'rgba(255,120,130,0.5)'; ctx.lineWidth = 1.5;
      for (var x = 30; x < C.W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x - 5, C.TOP + 9); ctx.lineTo(x, C.TOP + 4); ctx.lineTo(x + 5, C.TOP + 9); ctx.stroke();

      ctx.restore();
    }
  });

  // ---------------- Wraparound: no side walls; ball and paddle wrap across the edges ----------------
  register('wrap', {
    init: function (g) { g.wrapX = true; },
    render: function (ctx, g, r, layer) {
      if (layer !== 'back') return;
      ctx.save();
      // open edges: dashed glowing lines with arrows pointing through to the other side
      ctx.strokeStyle = 'rgba(120,255,220,0.45)'; ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]); ctx.lineDashOffset = -g.t * 18;
      ctx.beginPath(); ctx.moveTo(1, C.TOP); ctx.lineTo(1, C.H); ctx.moveTo(C.W - 1, C.TOP); ctx.lineTo(C.W - 1, C.H); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(120,255,220,0.35)';
      for (var y = 150; y < C.H - 60; y += 130) {
        ctx.beginPath(); ctx.moveTo(4, y - 7); ctx.lineTo(4, y + 7); ctx.lineTo(-4, y); ctx.closePath(); ctx.fill();

    var c = makeCanvas(Math.ceil(C.W * scale), Math.ceil(C.H * scale)), x = c.getContext('2d');

    x.fillStyle = 'rgba(255,255,255,0.045)';

    var grd = x.createRadialGradient(s / 2, s / 2, 2, s / 2, s / 2, s / 2);
    grd.addColorStop(0, 'rgba(255,255,255,0.55)'); grd.addColorStop(0.35, 'rgba(160,220,255,0.22)'); grd.addColorStop(1, 'rgba(120,200,255,0)');

  // Offscreen layers at playfield resolution (rules use them, e.g. the Lights Out darkness) and a soft light sprite.
  var layers = {}, lightSpr = null;
  R.layer = function (name) {

    return L;
  };
  R.lightSprite = function () {
    if (lightSpr) return lightSpr;
    var s = 128, c = makeCanvas(s, s), x = c.getContext('2d');
    var grd = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.45, 'rgba(255,255,255,0.9)');
    grd.addColorStop(0.75, 'rgba(255,255,255,0.4)'); grd.addColorStop(1, 'rgba(255,255,255,0)');

  // ---------------- bricks ----------------
  // Small shape mark in the middle of a brick (so groups never rely on colour alone).
  function drawMark(ctx, b, cx, cy, col) {
    ctx.fillStyle = col;
    if (b.mark === 'dot') { ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill(); }
    else if (b.mark === 'square') ctx.fillRect(cx - 3, cy - 3, 6, 6);
  }

  // A brick that is see-through (or fading): faint fill, dashed outline. b.warn pulses a white outline just
  // before it turns solid; b.pending flickers while it waits for a ball to move out of the way.
  function drawGhost(ctx, b, t, gh) {
    var x = b.x, y = b.y, w = b.w, h = b.h;
    ctx.globalAlpha = 1 - 0.85 * gh;
    roundRect(ctx, x, y, w, h, 3);
    ctx.fillStyle = b.color; ctx.fill();
    ctx.globalAlpha = 0.45 + 0.55 * gh;
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 1.5; ctx.strokeStyle = b.color;
    roundRect(ctx, x + 0.75, y + 0.75, w - 1.5, h - 1.5, 3); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    if (b.mark) drawMark(ctx, b, x + w / 2, y + h / 2, b.color);
    var wa = b.pending ? 0.5 + 0.5 * Math.sin(t * 40) : (b.warn > 0 ? b.warn * (0.55 + 0.45 * Math.sin(t * 26)) : 0);
    if (wa > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(1, wa).toFixed(3) + ')'; ctx.lineWidth = 2;
      roundRect(ctx, x - 0.5, y - 0.5, w + 1, h + 1, 3.5); ctx.stroke();
    }
  }

  function drawBrick(ctx, b, t) {
    var gh = b.ghost || 0;
    if (gh > 0.04) { drawGhost(ctx, b, t, gh); return; }
    var x = b.x, y = b.y, w = b.w, h = b.h;
    if (b.shake > 0) { b.shake -= 1 / 60; x += Math.sin(t * 90) * 1.2; }
    roundRect(ctx, x, y, w, h, 3);
    ctx.fillStyle = b.color; ctx.fill();
    // bevel
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(x + 2, y + 1.5, w - 4, 2.5);
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(x + 2, y + h - 3, w - 4, 2);
    var cx = x + w / 2, cy = y + h / 2;
    switch (b.type) {
      case 'armour':
        ctx.fillStyle = 'rgba(30,40,60,0.55)';
        for (var i = 0; i < b.hp; i++) { ctx.beginPath(); ctx.arc(cx - (b.hp - 1) * 3.5 + i * 7, cy + 1, 1.8, 0, TAU); ctx.fill(); }
        if (b.hp < b.maxHp) { // cracks
          ctx.strokeStyle = 'rgba(20,25,40,0.8)'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x + 5, y + 2); ctx.lineTo(x + 10, cy); ctx.lineTo(x + 8, y + h - 1);
          ctx.moveTo(x + 10, cy); ctx.lineTo(x + 16, cy - 2);
          if (b.maxHp - b.hp > 1) { ctx.moveTo(x + w - 5, y + 1); ctx.lineTo(x + w - 10, cy + 2); ctx.lineTo(x + w - 7, y + h - 1); }
          ctx.stroke();
        }
        break;
      case 'steel':
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
        ctx.beginPath();
        for (var k = 6; k + h - 4 < w - 5; k += 6) { ctx.moveTo(x + k, y + h - 2); ctx.lineTo(x + k + h - 4, y + 2); }
        ctx.stroke();
        ctx.fillStyle = '#9aa3b5';
        ctx.beginPath(); ctx.arc(x + 4, cy, 1.5, 0, TAU); ctx.arc(x + w - 4, cy, 1.5, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 3); ctx.stroke();
        break;
      case 'tnt':
        ctx.fillStyle = '#1b0505'; ctx.fillRect(x + 3, y + 2, 3, h - 4); ctx.fillRect(x + w - 6, y + 2, 3, h - 4);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 8px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('TNT', cx, cy + 0.5);
        break;
      case 'key':
        ctx.strokeStyle = '#5a3b00'; ctx.fillStyle = '#5a3b00'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(cx - 5, cy, 3, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - 2, cy); ctx.lineTo(cx + 7, cy); ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 4, cy + 3); ctx.moveTo(cx + 7, cy); ctx.lineTo(cx + 7, cy + 3); ctx.stroke();
        var gl = 0.35 + 0.35 * Math.sin(t * 5);
        ctx.strokeStyle = 'rgba(255,255,200,' + gl.toFixed(3) + ')'; ctx.lineWidth = 2; roundRect(ctx, x - 1, y - 1, w + 2, h + 2, 4); ctx.stroke();
        break;
      case 'locked':
        ctx.fillStyle = 'rgba(40,25,0,0.75)';
        ctx.fillRect(cx - 4, cy - 1, 8, 6);
        ctx.strokeStyle = 'rgba(40,25,0,0.75)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy - 1, 3, Math.PI, 0); ctx.stroke();
        break;
      case 'capsule':
        var hue = (t * 120 + x) % 360;
        ctx.strokeStyle = 'hsl(' + hue.toFixed(0) + ',90%,60%)'; ctx.lineWidth = 2; roundRect(ctx, x + 1, y + 1, w - 2, h - 2, 3); ctx.stroke();
        ctx.fillStyle = '#6a5acd'; ctx.font = 'bold 10px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', cx, cy + 0.5);
        break;
      case 'anchor':
        ctx.fillStyle = '#073b36';
        ctx.beginPath(); ctx.moveTo(cx, y + 2); ctx.lineTo(cx - 6, cy + 1); ctx.lineTo(cx - 2, cy + 1); ctx.lineTo(cx - 2, y + h - 2);
        ctx.lineTo(cx + 2, y + h - 2); ctx.lineTo(cx + 2, cy + 1); ctx.lineTo(cx + 6, cy + 1); ctx.closePath(); ctx.fill();
        break;
      case 'glow': // a little sun
        var gp = 0.5 + 0.5 * Math.sin(t * 4 + x);
        ctx.fillStyle = '#8a5a00';
        ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 1.3;
        ctx.beginPath();
        for (var ri = 0; ri < 6; ri++) { var ra = ri * TAU / 6 + t; ctx.moveTo(cx + Math.cos(ra) * 4.5, cy + Math.sin(ra) * 4.5); ctx.lineTo(cx + Math.cos(ra) * 6.5, cy + Math.sin(ra) * 6.5); }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,240,170,' + (0.4 + 0.5 * gp).toFixed(3) + ')'; ctx.lineWidth = 2;
        roundRect(ctx, x - 1.5, y - 1.5, w + 3, h + 3, 4.5); ctx.stroke();
        break;
      case 'switch': // half red, half blue, with swap arrows; the solid colour's half is outlined
        var redOn = b.showing !== 'blue';
        ctx.save(); roundRect(ctx, x, y, w, h, 3); ctx.clip();
        ctx.fillStyle = BT.Bricks.RED_COLOR; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
        ctx.fillStyle = BT.Bricks.BLUE_COLOR; ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();

        ctx.moveTo(cx + 7, cy + 2); ctx.lineTo(cx - 6, cy + 2); ctx.lineTo(cx - 3, cy + 5); ctx.stroke();
        ctx.strokeStyle = redOn ? '#ffb0b8' : '#b0ccff'; ctx.lineWidth = 2;

      case 'root':
        ctx.strokeStyle = '#3d2410'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx, y + 2); ctx.lineTo(cx, cy + 1); ctx.lineTo(cx - 7, y + h - 2);
        ctx.moveTo(cx, cy + 1); ctx.lineTo(cx + 7, y + h - 2); ctx.moveTo(cx, cy + 1); ctx.lineTo(cx, y + h - 1); ctx.stroke();
        ctx.fillStyle = '#ffe0b0';
        for (var hi = 0; hi < b.hp; hi++) { ctx.beginPath(); ctx.arc(x + 5 + hi * 4, y + 4, 1.4, 0, TAU); ctx.fill(); }
        if (b.hp < b.maxHp) {
          ctx.strokeStyle = 'rgba(20,10,0,0.8)'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x + w - 4, y + 2); ctx.lineTo(x + w - 9, cy); ctx.lineTo(x + w - 6, y + h - 2); ctx.stroke();
        }

        var pu = 0.5 + 0.5 * Math.sin(t * 6);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * pu).toFixed(3) + ')'; ctx.lineWidth = 2;

        for (var j = 0; j < b.hp; j++) { ctx.beginPath(); ctx.arc(cx - (b.hp - 1) * 3 + j * 6, y + h - 4, 1.6, 0, TAU); ctx.fill(); }
        break;
    }
    if (b.mark) drawMark(ctx, b, cx, cy + 0.5, 'rgba(10,12,30,0.45)');

      roundRect(ctx, x + 0.75, y + 0.75, w - 1.5, h - 1.5, 3); ctx.stroke();

  R.drawBrick = drawBrick;

  function drawBricks(ctx, g) {
    var bs = g.bricks, t = g.t;
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (!b.alive || b.customDraw) continue;
      drawBrick(ctx, b, t);
      if (b.wrap) {
        var ox = b.x;
        if (b.x + b.w > C.W) { b.x -= C.W; drawBrick(ctx, b, t); b.x = ox; }
        else if (b.x < 0) { b.x += C.W; drawBrick(ctx, b, t); b.x = ox; }
      }
    }
  }

  // ---------------- paddle, balls, capsules ----------------
  var paddleGrads = {};
  function drawPaddle(ctx, g) {
    var p = g.paddle, e = g.eff;
    if (p.off) { // switched off (e.g. out of bounces): a faint dashed outline the ball falls through
      ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
      roundRect(ctx, p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, p.h / 2); ctx.stroke(); ctx.setLineDash([]);
      return;
    }
    var sq = p.squash > 0 ? p.squash / C.paddle.squashTime : 0;
    var w = p.w * (1 + 0.08 * sq), h = p.h * (1 - 0.35 * sq);
    var x = p.x - w / 2, y = p.y - h / 2 + (p.h - h) / 2;
    if (e.daze > 0) x += Math.sin(g.t * 40) * 1.5;
    var col = e.flip > 0 ? '#e04dff' : (e['catch'] > 0 ? '#9b7bff' : '#4fd8ff');
    // glow
    ctx.fillStyle = 'rgba(79,216,255,0.12)';
    roundRect(ctx, x - 4, y - 4, w + 8, h + 8, (h + 8) / 2); ctx.fill();
    var grd = paddleGrads[col];
    if (!grd) {
      grd = paddleGrads[col] = ctx.createLinearGradient(0, p.y - p.h / 2, 0, p.y + p.h / 2);
      grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.35, col); grd.addColorStop(1, '#1b4f7a');
    }
    ctx.fillStyle = p.hitFlash > 0 ? '#ffffff' : grd;
    roundRect(ctx, x, y, w, h, h / 2); ctx.fill();
    if (e.laser > 0) {
      ctx.fillStyle = '#ff9f43';
      ctx.fillRect(x + 3, y - 5, 5, 7); ctx.fillRect(x + w - 8, y - 5, 5, 7);
    }
    if (e['catch'] > 0) {
      ctx.fillStyle = 'rgba(200,255,150,0.8)';
      for (var i = 0; i < 5; i++) ctx.fillRect(x + w * (0.15 + i * 0.175) - 1.5, y - 2, 3, 3 + (i % 2) * 2);
    }
    if (e.flip > 0) {
      ctx.strokeStyle = '#ffffff'; drawIcon(ctx, 'flip', p.x, p.y, 8);
    }
    if (e.daze > 0) {
      ctx.fillStyle = '#ffe27a';
      for (var k = 0; k < 3; k++) { var a = g.t * 6 + k * TAU / 3; ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 14, p.y - 12 + Math.sin(a) * 4, 2, 0, TAU); ctx.fill(); }
    }
  }

  function drawBalls(ctx, g) {
    var spr = getBallSprite();
    for (var i = 0; i < g.balls.length; i++) {
      var b = g.balls[i];
      // trail
      var n = b.trailN, len = b.trail.length / 2;
      ctx.fillStyle = g.bomb ? '#ff8c3c' : '#aae1ff';
      for (var k = 0; k < n; k++) {
        var idx = (b.trailI - 1 - k + len * 2) % len;
        ctx.globalAlpha = (1 - k / n) * 0.35;
        var rr = b.r * (1 - k / n * 0.6);
        ctx.beginPath(); ctx.arc(b.trail[idx * 2], b.trail[idx * 2 + 1], rr, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.drawImage(spr, b.x - 24, b.y - 24, 48, 48);
      ctx.fillStyle = g.bomb ? '#ff7a3d' : '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      if (g.bomb) {
        ctx.fillStyle = '#ffe27a';
        ctx.beginPath(); ctx.arc(b.x + Math.sin(g.t * 30) * 3, b.y - b.r - 2, 1.8, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(180,220,255,0.9)';
        ctx.beginPath(); ctx.arc(b.x - 1.8, b.y - 1.8, b.r * 0.35, 0, TAU); ctx.fill();
      }
    }
  }

  // Extra paddles (mirror paddle at the top, computer rival). Same look as yours, in their own colour.
  var xpGrads = {};
  function drawXPaddle(ctx, g, q) {
    if (q.off) return;
    var sq = q.squash > 0 ? q.squash / C.paddle.squashTime : 0;
    var w = q.w * (1 + 0.08 * sq), h = q.h * (1 - 0.35 * sq);
    var x = q.x - w / 2, y = q.y - h / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(ctx, x - 4, y - 4, w + 8, h + 8, (h + 8) / 2); ctx.fill();
    var key = q.color + '@' + q.y, grd = xpGrads[key];
    if (!grd) {
      grd = xpGrads[key] = ctx.createLinearGradient(0, q.y + q.h / 2, 0, q.y - q.h / 2); // lit from below: it faces down
      grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.35, q.color); grd.addColorStop(1, '#4a1f1f');
    }
    ctx.fillStyle = q.hitFlash > 0 ? '#ffffff' : grd;
    roundRect(ctx, x, y, w, h, h / 2); ctx.fill();
    if (q.kind === 'mirror') { // small chevrons: "copies you"
      ctx.strokeStyle = 'rgba(60,30,0,0.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(q.x - 4, q.y - 2); ctx.lineTo(q.x, q.y + 2); ctx.lineTo(q.x + 4, q.y - 2); ctx.stroke();
    }
  }

  // Draw fn at x, plus copies one playfield-width either side when the field wraps (seamless edges).
  function wrapDraw(ctx, g, fn, a) {
    fn(ctx, g, a);
    if (!g.wrapX) return;
    ctx.save(); ctx.translate(C.W, 0); fn(ctx, g, a); ctx.translate(-2 * C.W, 0); fn(ctx, g, a); ctx.restore();
  }

  function drawCapsule(ctx, type, x, y, t, scale) {
    var st = CAPSULE_STYLE[type] || { c: '#fff' };
    var w = C.capsule.w * (scale || 1), h = C.capsule.h * (scale || 1);
    roundRect(ctx, x - w / 2, y - h / 2, w, h, h / 2);
    ctx.fillStyle = st.c; ctx.fill();
    if (st.bad) { // warning stripes on bad capsules
      ctx.save(); roundRect(ctx, x - w / 2, y - h / 2, w, h, h / 2); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      for (var k = -w; k < w; k += 8) { ctx.beginPath(); ctx.moveTo(x + k, y + h / 2); ctx.lineTo(x + k + 4, y + h / 2); ctx.lineTo(x + k + 4 + h, y - h / 2); ctx.lineTo(x + k + h, y - h / 2); ctx.fill(); }
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5;
    roundRect(ctx, x - w / 2, y - h / 2, w, h, h / 2); ctx.stroke();
    ctx.fillStyle = '#10131f'; ctx.strokeStyle = '#10131f';
    drawIcon(ctx, type, x, y, h * 0.75);
  }

  // ---------------- HUD ----------------
  var EFFECT_ORDER = ['long', 'slow', 'catch', 'laser', 'shrink', 'flip'];
  function drawHUD(ctx, g, levelLabel, opts) {
    ctx.fillStyle = 'rgba(5,7,16,0.85)'; ctx.fillRect(0, 0, C.W, C.TOP);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(0, C.TOP - 1, C.W, 1);
    // lives
    var lx = 12;
    for (var i = 0; i < Math.min(g.lives, 5); i++) {
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(lx + i * 14, 22, 5, 0, TAU); ctx.fill();
    }
    if (g.lives > 5) { ctx.fillStyle = '#fff'; ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('+' + (g.lives - 5), lx + 5 * 14, 22); }
    // level + score
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '11px ' + FONT;
    ctx.fillText(levelLabel, C.W / 2, 12);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 17px ' + FONT;
    ctx.fillText(String(g.score), C.W / 2, 29);
    if (g.combo >= 3) {
      ctx.fillStyle = '#ffd35a'; ctx.font = 'bold 11px ' + FONT; ctx.textAlign = 'left';
      ctx.fillText('x' + Math.min(g.combo, C.combo.maxMult) + ' combo', C.W / 2 + 34, 29);
    }
    // pause button
    roundRect(ctx, C.W - 44, 6, 36, 30, 8); ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(C.W - 31, 14, 4, 14); ctx.fillRect(C.W - 23, 14, 4, 14);

    // timed effects with draining bars
    var ex = 6, ey = C.TOP + 4, d = C.capsule.durations;
    for (i = 0; i < EFFECT_ORDER.length; i++) {
      var k = EFFECT_ORDER[i], v = g.eff[k];
      if (!(v > 0)) continue;
      var st = CAPSULE_STYLE[k];
      roundRect(ctx, ex, ey, 40, 16, 5); ctx.fillStyle = 'rgba(5,7,16,0.7)'; ctx.fill();
      ctx.fillStyle = st.c; ctx.strokeStyle = st.c; drawIcon(ctx, k, ex + 10, ey + 7, 9);
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(ex + 20, ey + 6, 16, 3);
      ctx.fillStyle = st.c; ctx.fillRect(ex + 20, ey + 6, 16 * Math.min(1, v / d[k]), 3);
      ex += 44;
    }

// Boot, fixed-step loop, scene switching. Wires the pure game to sound, particles, input and UI.

      BT.Input.init(this.canvas, this);

      window.addEventListener('resize', function () { self.resize(); });
      window.addEventListener('orientationchange', function () { setTimeout(function () { self.resize(); }, 120); });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { self.autoPause(); BT.Audio.suspend(); }

        else if (this.overlay === 'pause') BT.UI.drawPause(ctx, this);
        else if (this.overlay === 'won') BT.UI.drawWon(ctx, this, this.overlayT);

    }
